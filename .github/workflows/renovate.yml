name: Renovate

on:
  schedule:
    - cron: '0 2 * * 1'  # Weekly, Monday 02:00 UTC — must fall inside renovate.json's schedule:weekly window (before 4 AM UTC Monday)
  workflow_dispatch:

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.0
        with:
          configurationFile: renovate.json
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
