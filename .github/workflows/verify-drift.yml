name: Verify Drift

on:
  schedule:
    - cron: '0 6 * * *'  # daily at 06:00 UTC
  workflow_dispatch:

jobs:
  verify-drift:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - uses: arduino/setup-task@v2
        with:
          version: "3"

      - name: Install dependencies
        run: task setup

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.HOMEKUBE_SSH_PRIVATE_KEY }}" > ~/.ssh/id_darth_homekube
          chmod 600 ~/.ssh/id_darth_homekube
          cat >> ~/.ssh/config <<'EOF'
          Host pi0
            HostName 10.0.0.20
            User homekube
            StrictHostKeyChecking accept-new
          Host pi1
            HostName 10.0.0.21
            User homekube
            StrictHostKeyChecking accept-new
          Host pi2
            HostName 10.0.0.22
            User homekube
            StrictHostKeyChecking accept-new
          Host pi3
            HostName 10.0.0.23
            User homekube
            StrictHostKeyChecking accept-new
          EOF

      - name: Run verify-drift
        id: drift
        run: task verify-drift

      - name: Open issue on drift
        if: failure() && steps.drift.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Drift detected — ${new Date().toISOString().slice(0, 10)}`,
              body: [
                '## Drift detected',
                '',
                'The scheduled `verify-drift` run found drift.',
                `See the [run log](${runUrl}) for the full summary.`,
                '',
                'Fix: SSH into darth and run `task verify-drift` to reproduce,',
                'then apply the relevant provisioning playbook.',
              ].join('\n'),
            });
