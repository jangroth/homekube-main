name: Ansible Lint

on:
  pull_request:
    paths:
      - "ansible/**"
      - "Taskfile.yml"
      - ".ansible-lint"
      - ".yamllint"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ansible-lint.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - uses: arduino/setup-task@v2
        with:
          version: "3"

      - name: Install dependencies
        run: task setup

      - name: Run ansible-lint
        run: task lint
