version: "3"

vars:
  ANSIBLE_DIR: ./ansible

tasks:
  default:
    desc: "List available tasks"
    cmd: task --list

  setup:
    desc: "Install Python dependencies and Ansible collections"
    cmds:
      - uv sync
      - uv run ansible-galaxy collection install -r {{.ANSIBLE_DIR}}/requirements.yml

  10-nvme:
    desc: "NVMe migration (pass extra args: -- --tags nvme_pre | --tags nvme_post --limit pi0,pi1,pi2)"
    dir: "{{.ANSIBLE_DIR}}"
    cmd: uv run ansible-playbook 10-nvme.yml {{.CLI_ARGS}}

  20-configure-darth:
    desc: "Configure darth: SSH config, /etc/hosts, tooling"
    dir: "{{.ANSIBLE_DIR}}"
    cmd: uv run ansible-playbook 20-configure-darth.yml

  21-provision-pis:
    desc: "Provision pis: homekube user, keys, base OS, swap"
    dir: "{{.ANSIBLE_DIR}}"
    cmd: uv run ansible-playbook 21-provision-pis.yml {{.CLI_ARGS}}

  22-k8s-nodes:
    desc: "K8s prerequisites on all nodes: cgroups, containerd, packages"
    dir: "{{.ANSIBLE_DIR}}"
    cmd: uv run ansible-playbook 22-k8s-nodes.yml {{.CLI_ARGS}}

  30-k8s-control-plane:
    desc: "kubeadm init on pi0"
    dir: "{{.ANSIBLE_DIR}}"
    cmd: uv run ansible-playbook 30-k8s-control-plane.yml

  40-cni:
    desc: "Install and configure CNI (Cilium)"
    dir: "{{.ANSIBLE_DIR}}"
    cmd: uv run ansible-playbook 40-cni.yml

  50-gitops:
    desc: "Install and configure GitOps (ArgoCD)"
    dir: "{{.ANSIBLE_DIR}}"
    cmd: uv run ansible-playbook 50-gitops.yml

  update-all:
    desc: "Update darth and all Kubernetes nodes"
    deps:
      - update-darth
      - update-k8s-nodes

  update-darth:
    desc: "Update darth: tools and configuration"
    dir: "{{.ANSIBLE_DIR}}"
    cmd: uv run ansible-playbook 20-configure-darth.yml --tags update-only

  update-k8s-nodes:
    desc: "Update Kubernetes nodes (system packages, storage)"
    dir: "{{.ANSIBLE_DIR}}"
    cmd: uv run ansible-playbook 22-k8s-nodes.yml --tags update-only
