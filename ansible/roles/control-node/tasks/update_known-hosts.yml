---
- name: Get SSH host keys from all nodes
  command: ssh-keyscan "{{ item }}"
  register: host_keys
  loop: "{{ groups['all_nodes'] }}"

- name: Remove existing host keys from known_hosts
  known_hosts:
    name: "{{ item.item }}"
    state: absent
    path: "~/.ssh/known_hosts"
  loop: "{{ host_keys.results }}"

- name: Add host keys to known_hosts
  known_hosts:
    name: "{{ item.item }}"
    key: "{{ item.stdout_lines | reject('match', '^#') | join('\n') }}"
    state: present
    path: "~/.ssh/known_hosts"
  loop: "{{ host_keys.results }}"
