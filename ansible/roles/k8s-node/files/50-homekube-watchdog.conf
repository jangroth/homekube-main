# Vendor drop-in (40-rpi-enable-watchdog.conf) arms the hardware watchdog with
# RuntimeWatchdogSec=1min, requiring systemd to pet it every ~30s. Under heavy
# load (e.g. ArgoCD install churning many pods on pi0), systemd occasionally
# misses that interval and the hardware resets the node. 10min is well within
# the Raspberry Pi hardware watchdog's maximum and gives systemd ~5min of
# sustained-load headroom before a reset is triggered.
[Manager]
RuntimeWatchdogSec=10min
