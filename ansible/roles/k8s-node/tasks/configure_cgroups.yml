---
- name: Enable cgroup in /boot/firmware/cmdline.txt
  lineinfile:
    path: /boot/firmware/cmdline.txt
    backrefs: yes
    regexp: "^(console=serial0(?!.*cgroup_enable=memory).*)$"
    line: '\1 cgroup_enable=cpuset cgroup_enable=memory cgroup_memory=1'
  register: cgroup_cmdline

- name: Reboot to apply cgroup changes
  ansible.builtin.reboot:
    reboot_timeout: 180
  when: cgroup_cmdline.changed
