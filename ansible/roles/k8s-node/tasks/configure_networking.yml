---
- name: Include group variables for Raspberry Pis
  include_vars:
    dir: "{{ playbook_dir }}/group_vars"

- name: Set static IP address
  nmcli:
    conn_name: "Wired connection 1"
    ifname: eth0
    state: present
    type: ethernet
    ip4: "{{ ip_addresses_internal[inventory_hostname] }}"
    method4: manual
    autoconnect: true

- name: Activate connection (if not already active)
  nmcli:
    conn_name: "Wired connection 1"
    state: up

- name: Make connection persistent across reboots
  nmcli:
    conn_name: "Wired connection 1"
    state: present
    autoconnect: true

- name: Restart networking
  service:
    name: NetworkManager
    state: restarted

- name: Exclude Cilium-managed interfaces from NetworkManager
  ansible.builtin.copy:
    dest: /etc/NetworkManager/conf.d/99-cilium-unmanaged.conf
    content: |
      # Without this, NetworkManager treats cilium_host/lxc* veths as unconfigured
      # ethernet devices and loops forever trying (and failing) to DHCP them.
      [keyfile]
      unmanaged-devices=interface-name:cilium*;interface-name:lxc*;interface-name:veth*
    mode: "0644"
  tags: networking-cilium-fix
  notify: Restart NetworkManager (Cilium fix)
