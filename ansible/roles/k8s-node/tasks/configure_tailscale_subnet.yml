---
- name: Get current Tailscale advertised routes
  command: tailscale status --json
  register: tailscale_status
  changed_when: false

- name: Advertise LoadBalancer pool (Cilium LB-IPAM) via Tailscale subnet routing
  command: tailscale set --advertise-routes=192.168.86.240/28
  when: >-
    '192.168.86.240/28' not in
    ((tailscale_status.stdout | from_json).get('Self', {}).get('AdvertisedRoutes') or [])
