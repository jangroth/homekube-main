---
- name: Create fresh bootstrap token on pi0
  ansible.builtin.command: kubeadm token create
  delegate_to: pi0
  run_once: true
  become: true
  register: _token
  changed_when: true

- name: Get CA cert hash from pi0
  ansible.builtin.shell: >
    openssl x509 -in /etc/kubernetes/pki/ca.crt -pubkey -noout |
    openssl pkey -pubin -outform DER |
    openssl dgst -sha256 -hex | awk '{print $NF}'
  delegate_to: pi0
  run_once: true
  become: true
  register: _ca_hash
  changed_when: false

- name: Broadcast join credentials to all workers
  ansible.builtin.set_fact:
    kubeadm_token: "{{ hostvars[groups['data_plane'][0]]._token.stdout | trim }}"
    kubeadm_ca_hash: "{{ hostvars[groups['data_plane'][0]]._ca_hash.stdout | trim }}"
