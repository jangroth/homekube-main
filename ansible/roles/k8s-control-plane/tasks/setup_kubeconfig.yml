---
- name: Create .kube directory for {{ ssh_username }} on pi0
  ansible.builtin.file:
    path: "/home/{{ ssh_username }}/.kube"
    state: directory
    owner: "{{ ssh_username }}"
    group: "{{ ssh_username }}"
    mode: "0750"

- name: Copy admin.conf to homekube user kubeconfig on pi0
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ ssh_username }}/.kube/config"
    owner: "{{ ssh_username }}"
    group: "{{ ssh_username }}"
    mode: "0600"
    remote_src: yes

- name: Fetch kubeconfig from pi0 to darth
  ansible.builtin.fetch:
    src: /etc/kubernetes/admin.conf
    dest: "{{ lookup('env', 'HOME') }}/.kube/homekube.config"
    flat: yes

- name: Rewrite kubeconfig server URL for Tailscale access
  ansible.builtin.replace:
    path: "{{ lookup('env', 'HOME') }}/.kube/homekube.config"
    regexp: 'https://10\.0\.0\.20:6443'
    replace: 'https://pi0:6443'
  delegate_to: localhost
  become: false

- name: Check current kubeconfig context name
  ansible.builtin.shell: >
    kubectl --kubeconfig {{ lookup('env', 'HOME') }}/.kube/homekube.config
    config current-context
  delegate_to: localhost
  become: false
  register: current_context
  changed_when: false

- name: Rename kubeconfig context to homekube
  ansible.builtin.command: >
    kubectl --kubeconfig {{ lookup('env', 'HOME') }}/.kube/homekube.config
    config rename-context {{ current_context.stdout | trim }} homekube
  delegate_to: localhost
  become: false
  changed_when: true
  when: current_context.stdout | trim != "homekube"
