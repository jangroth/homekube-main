---
# https://docs.cilium.io/en/stable/helm-reference/

upgradeCompatibility: "1.17"

k8sServiceHost: "10.0.0.20" # switch IP — Tailscale is invisible to k8s
k8sServicePort: "6443"
kubeProxyReplacement: true # kubeadm skips kube-proxy (skipPhases: addon/kube-proxy)

devices: "eth0,wlan0,tailscale0" # tailscale0 added (DECISION-032) so Cilium's cil_from_netdev intercepts VIP traffic arriving from Tailscale subnet routing
routingMode: "tunnel"
tunnelProtocol: "vxlan"

ipam:
  mode: "kubernetes"

l2announcements:
  enabled: true

# Leader election for L2 announcements is API-chatty (one lease per announcing service).
# Raise the client-go rate limit so the agent does not get throttled.
k8sClientRateLimit:
  qps: 50
  burst: 100

# Cilium agent DaemonSet (covers main container and init containers:
# config, mount-cgroup, apply-sysctl-overwrites, mount-bpf-fs, clean-cilium-state).
# Baselines are conservative estimates for Raspberry Pi 4 nodes.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Cilium Envoy proxy DaemonSet (L7 policy enforcement).
envoy:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 256Mi

# Cilium Operator Deployment (cluster-scoped controller).
operator:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

hubble:
  enabled: true
  relay:
    enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
  ui:
    enabled: true
    frontend:
      resources:
        requests:
          cpu: 5m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 64Mi
    backend:
      resources:
        requests:
          cpu: 5m
          memory: 32Mi
        limits:
          cpu: 50m
          memory: 128Mi
