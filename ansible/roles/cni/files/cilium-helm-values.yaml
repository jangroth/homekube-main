---
# https://docs.cilium.io/en/stable/helm-reference/

upgradeCompatibility: "1.17"

k8sServiceHost: "10.0.0.20" # switch IP — Tailscale is invisible to k8s
k8sServicePort: "6443"
kubeProxyReplacement: true # kubeadm skips kube-proxy (skipPhases: addon/kube-proxy)

devices: "eth0,wlan0,tailscale0" # tailscale0 added (DECISION-032) so Cilium's cil_from_netdev intercepts VIP traffic arriving from Tailscale subnet routing
routingMode: "tunnel"
tunnelProtocol: "vxlan"

ipam:
  mode: "kubernetes"

l2announcements:
  enabled: true

# Leader election for L2 announcements is API-chatty (one lease per announcing service).
# Raise the client-go rate limit so the agent does not get throttled.
k8sClientRateLimit:
  qps: 50
  burst: 100

hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
