---
- name: Update apt packages
  apt:
    update_cache: true
    upgrade: dist
    cache_valid_time: 3600
    autoclean: true
    autoremove: true

- name: Check for a pending kernel reboot
  ansible.builtin.include_role:
    name: k8s-node
    tasks_from: check_pending_reboot

# Opt-in via -e allow_reboot=true: this role also runs during provisioning
- name: Reboot into the installed kernel
  reboot:
    msg: "Reboot initiated by Ansible for kernel updates"
    connect_timeout: 5
    reboot_timeout: 300
    pre_reboot_delay: 0
    post_reboot_delay: 30
    test_command: uptime
  when:
    - kernel_reboot_pending
    - allow_reboot | default(false) | bool
