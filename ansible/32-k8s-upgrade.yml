---
- name: Upgrade k8s control plane
  hosts: control_plane
  become: true
  vars:
    kubeconfig: /etc/kubernetes/admin.conf
  tasks:
    - name: Read Longhorn volume health before upgrade
      ansible.builtin.command: >-
        kubectl --kubeconfig {{ kubeconfig }} -n longhorn-system
        get volumes.longhorn.io -o json
      register: _lh_pre
      changed_when: false

    - name: Require every attached volume to be healthy before upgrade
      ansible.builtin.assert:
        that: _unhealthy | length == 0
        fail_msg: >-
          Longhorn not healthy ({{ _unhealthy | join(', ') }}) —
          refusing to upgrade {{ inventory_hostname }}
      vars:
        _unhealthy: >-
          {{ (_lh_pre.stdout | from_json)['items']
             | rejectattr('status.state', 'eq', 'detached')
             | rejectattr('status.robustness', 'eq', 'healthy')
             | map(attribute='metadata.name') | list }}

    - name: Cordon control plane node
      ansible.builtin.command:
        cmd: "kubectl --kubeconfig {{ kubeconfig }} cordon {{ inventory_hostname }}"

    - name: Retarget Kubernetes apt repository
      import_tasks: roles/k8s-node/tasks/retarget_kube_apt_repo.yml

    - name: Update apt cache
      apt:
        update_cache: true

    - name: Unhold kubeadm
      dpkg_selections:
        name: kubeadm
        selection: install

    - name: Install kubeadm
      apt:
        pkg: kubeadm
        state: latest

    - name: Hold kubeadm
      dpkg_selections:
        name: kubeadm
        selection: hold

    - name: Copy kubeadm configuration
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/roles/k8s-control-plane/files/kubeadm-config.yaml"
        dest: "/home/{{ ssh_username }}/kubeadm-config.yaml"
        backup: false
        owner: "{{ ssh_username }}"
        group: "{{ ssh_username }}"
        mode: "0644"

    - name: Re-upload kubeadm ClusterConfiguration
      ansible.builtin.command:
        cmd: "kubeadm init phase upload-config kubeadm --config /home/{{ ssh_username }}/kubeadm-config.yaml"
      changed_when: true

    - name: Show kubeadm upgrade plan
      ansible.builtin.command:
        cmd: "kubeadm upgrade plan"
      changed_when: false

    - name: Apply kubeadm upgrade
      ansible.builtin.command:
        cmd: "kubeadm upgrade apply v{{ kubernetes_version }} -y"

    - name: Unhold kubelet and kubectl
      dpkg_selections:
        name: "{{ item }}"
        selection: install
      loop:
        - kubelet
        - kubectl

    - name: Install kubelet and kubectl
      apt:
        pkg:
          - kubelet
          - kubectl
        state: latest

    - name: Hold kubelet and kubectl
      dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubectl

    - name: Restart kubelet
      ansible.builtin.systemd:
        name: kubelet
        state: restarted
        daemon_reload: true

    - name: Uncordon control plane node
      ansible.builtin.command:
        cmd: "kubectl --kubeconfig {{ kubeconfig }} uncordon {{ inventory_hostname }}"

    - name: Wait for control plane node to report new version and Ready
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig {{ kubeconfig }} get node {{ inventory_hostname }}
          -o jsonpath='{.status.nodeInfo.kubeletVersion}|{.status.conditions[?(@.type=="Ready")].status}'
      register: control_plane_node_status
      until: control_plane_node_status.stdout == ('v' + kubernetes_version + '|True')
      retries: 30
      delay: 10
      changed_when: false

    - name: Wait for Longhorn replicas to rebuild and stay healthy
      ansible.builtin.command: >-
        kubectl --kubeconfig {{ kubeconfig }} -n longhorn-system
        get volumes.longhorn.io -o json
      register: _lh_post
      until: >-
        _lh_post.rc == 0
        and ((_lh_post.stdout | from_json)['items']
             | rejectattr('status.state', 'eq', 'detached')
             | rejectattr('status.robustness', 'eq', 'healthy')
             | list | length) == 0
      retries: 90
      delay: 20
      changed_when: false
      loop: [1, 2, 3]
      loop_control:
        pause: 45
        label: "confirmation {{ item }}/3"

- name: Upgrade k8s worker nodes
  hosts: data_plane
  become: true
  serial: 1
  vars:
    kubeconfig: /etc/kubernetes/admin.conf
  tasks:
    - name: Read Longhorn volume health before upgrade
      ansible.builtin.command: >-
        kubectl --kubeconfig {{ kubeconfig }} -n longhorn-system
        get volumes.longhorn.io -o json
      delegate_to: "{{ groups['control_plane'][0] }}"
      register: _lh_pre
      changed_when: false

    - name: Require every attached volume to be healthy before upgrade
      ansible.builtin.assert:
        that: _unhealthy | length == 0
        fail_msg: >-
          Longhorn not healthy ({{ _unhealthy | join(', ') }}) —
          refusing to upgrade {{ inventory_hostname }}
      vars:
        _unhealthy: >-
          {{ (_lh_pre.stdout | from_json)['items']
             | rejectattr('status.state', 'eq', 'detached')
             | rejectattr('status.robustness', 'eq', 'healthy')
             | map(attribute='metadata.name') | list }}

    - name: Cordon worker node
      ansible.builtin.command:
        cmd: "kubectl --kubeconfig {{ kubeconfig }} cordon {{ inventory_hostname }}"
      delegate_to: "{{ groups['control_plane'][0] }}"

    - name: Retarget Kubernetes apt repository
      import_tasks: roles/k8s-node/tasks/retarget_kube_apt_repo.yml

    - name: Update apt cache
      apt:
        update_cache: true

    - name: Unhold kubeadm
      dpkg_selections:
        name: kubeadm
        selection: install

    - name: Install kubeadm
      apt:
        pkg: kubeadm
        state: latest

    - name: Hold kubeadm
      dpkg_selections:
        name: kubeadm
        selection: hold

    - name: Upgrade kubeadm node config
      ansible.builtin.command:
        cmd: "kubeadm upgrade node"

    - name: Unhold kubelet and kubectl
      dpkg_selections:
        name: "{{ item }}"
        selection: install
      loop:
        - kubelet
        - kubectl

    - name: Install kubelet and kubectl
      apt:
        pkg:
          - kubelet
          - kubectl
        state: latest

    - name: Hold kubelet and kubectl
      dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubectl

    - name: Restart kubelet
      ansible.builtin.systemd:
        name: kubelet
        state: restarted
        daemon_reload: true

    - name: Uncordon worker node
      ansible.builtin.command:
        cmd: "kubectl --kubeconfig {{ kubeconfig }} uncordon {{ inventory_hostname }}"
      delegate_to: "{{ groups['control_plane'][0] }}"

    - name: Wait for worker node to report new version and Ready
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig {{ kubeconfig }} get node {{ inventory_hostname }}
          -o jsonpath='{.status.nodeInfo.kubeletVersion}|{.status.conditions[?(@.type=="Ready")].status}'
      register: worker_node_status
      until: worker_node_status.stdout == ('v' + kubernetes_version + '|True')
      retries: 30
      delay: 10
      changed_when: false
      delegate_to: "{{ groups['control_plane'][0] }}"

    - name: Wait for Longhorn replicas to rebuild and stay healthy
      ansible.builtin.command: >-
        kubectl --kubeconfig {{ kubeconfig }} -n longhorn-system
        get volumes.longhorn.io -o json
      delegate_to: "{{ groups['control_plane'][0] }}"
      register: _lh_post
      until: >-
        _lh_post.rc == 0
        and ((_lh_post.stdout | from_json)['items']
             | rejectattr('status.state', 'eq', 'detached')
             | rejectattr('status.robustness', 'eq', 'healthy')
             | list | length) == 0
      retries: 90
      delay: 20
      changed_when: false
      loop: [1, 2, 3]
      loop_control:
        pause: 45
        label: "confirmation {{ item }}/3"
